[package]
name = "seekoffer-desktop"
version = "0.2.22"
description = "寻鹿 SeekOffer 桌面客户端"
authors = ["SeekOffer"]
homepage = "https://www.seekoffer.com.cn"
edition = "2021"

[lib]
name = "seekoffer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "=0.22.1"
imagesize = "=0.15.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "charset", "stream"] }
scraper = "=0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "=1.53.1", features = ["net"] }
url = "=2.5.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2"

[dev-dependencies]
minisign-verify = "0.2.5"
