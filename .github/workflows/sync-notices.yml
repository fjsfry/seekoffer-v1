name: Sync notices to Supabase

on:
  schedule:
    # Hourly incremental sync. GitHub cron uses UTC; this is hourly in Beijing time too.
    - cron: '20 * * * *'
    # Nightly full reconciliation at 02:10 Beijing time.
    - cron: '10 18 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-notices.yml'
      - 'scripts/sync-baoyan-notices-to-supabase.mjs'
      - 'scripts/notice-sync-core.mjs'
      - 'lib/notice-quality.ts'
      - 'tests/notice-sync-core.test.mjs'
      - 'tests/notice-quality.test.ts'
      - 'supabase/functions/ingest-notices/**'
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Sync mode'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      target_year:
        description: 'Notice target year'
        required: false
        default: '2026'
      primary_max_pages:
        description: 'Optional max pages for a quick/manual test. Leave empty for full sync.'
        required: false
        default: ''
      primary_max_details:
        description: 'Optional max detail requests for smoke tests. Leave empty for full sync.'
        required: false
        default: ''
      dry_run:
        description: 'Parse notices without writing to Supabase'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-notices-to-supabase
  cancel-in-progress: false

jobs:
  sync:
    name: Sync public notices
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      SYNC_MODE: ${{ github.event.inputs.sync_mode || (github.event_name == 'push' && 'full' || (github.event.schedule == '10 18 * * *' && 'full' || 'incremental')) }}
      TARGET_YEAR: ${{ github.event.inputs.target_year || '2026' }}
      PRIMARY_ORDER_BY: publishTime
      PRIMARY_MAX_PAGES: ${{ github.event.inputs.primary_max_pages }}
      PRIMARY_MAX_DETAILS: ${{ github.event.inputs.primary_max_details }}
      PRIMARY_DETAIL_CONCURRENCY: '6'
      PRIMARY_DETAIL_DELAY_MS: '50'
      ENABLE_XINGKE_SOURCE: 'true'
      ENABLE_BAOYANNEWS_SOURCE: 'true'
      INCREMENTAL_LOOKBACK_DAYS: '10'
      BAOYANNEWS_PAGE_DELAY_MS: '80'
      OFFICIAL_REPAIR_CONCURRENCY: '4'
      OFFICIAL_REPAIR_DELAY_MS: '80'
      INGEST_BATCH_SIZE: '100'
      INGEST_MAX_ATTEMPTS: '3'
      INGEST_RETRY_BASE_DELAY_MS: '1000'
      REQUEST_TIMEOUT_MS: '15000'
      MAX_RATE_LIMIT_RETRY_AFTER_SECONDS: '30'
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_INGEST_URL: ${{ secrets.SUPABASE_INGEST_URL }}
      SUPABASE_INGEST_SECRET: ${{ secrets.SEEKOFFER_INGEST_SECRET || secrets.SUPABASE_INGEST_SECRET }}
      SUPABASE_INGEST_SOURCE: github-actions-sync
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync notices
        run: npm run sync:notices:github

      - name: Rebuild searchable notice pages
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; database sync is complete, static pages refresh on the next deployment."
            exit 0
          fi

          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Triggered Vercel rebuild for notice detail pages and sitemap."
