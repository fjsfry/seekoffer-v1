name: Sync notices to Cloudflare D1

on:
  schedule:
    # GitHub schedules use UTC. The first job keeps the recent window fresh;
    # the second job performs a bounded full reconciliation every night in
    # Beijing time so older notices can be repaired without user traffic.
    - cron: '20 * * * *'
    - cron: '10 18 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-notices.yml'
      - 'scripts/sync-baoyan-notices-to-d1.mjs'
      - 'scripts/notice-sync-core.mjs'
      - 'scripts/notice-d1-transport.mjs'
      - 'scripts/notice-sync-report.mjs'
      - 'scripts/verify-notice-website-sync.mjs'
      - 'tests/notice-d1-transport.test.mjs'
      - 'tests/notice-website-sync.test.mjs'
      - 'lib/notice-quality.ts'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Acquire and validate public notices without D1 writes'
        type: boolean
        default: false
      sync_mode:
        description: 'Incremental hourly sync or full reconciliation'
        type: choice
        options: [incremental, full]
        default: incremental

concurrency:
  group: seekoffer-notice-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Acquire, validate and update D1 notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEEKOFFER_INGEST_URL: https://migration.seekoffer.com.cn/v1/internal/ingest-notices
      SEEKOFFER_INGEST_SECRET: ${{ secrets.SEEKOFFER_INGEST_SECRET }}
      SEEKOFFER_INGEST_SOURCE: github-actions-sync
      SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_mode || 'incremental' }}
      TARGET_YEAR: '2026'
      PRIMARY_ORDER_BY: publishTime
      PRIMARY_MAX_PAGES: ${{ github.event.schedule == '10 18 * * *' && '0' || '2' }}
      PRIMARY_MAX_DETAILS: ${{ github.event.schedule == '10 18 * * *' && '0' || '40' }}
      PRIMARY_DETAIL_CONCURRENCY: '2'
      PRIMARY_DETAIL_DELAY_MS: '150'
      ENABLE_XINGKE_SOURCE: 'true'
      ENABLE_BAOYANNEWS_SOURCE: 'true'
      INCREMENTAL_LOOKBACK_DAYS: '10'
      OFFICIAL_REPAIR_CONCURRENCY: '2'
      OFFICIAL_REPAIR_DELAY_MS: '150'
      INGEST_BATCH_SIZE: '6'
      INGEST_MAX_ATTEMPTS: '2'
      INGEST_REQUEST_TIMEOUT_MS: '30000'
      REQUEST_TIMEOUT_MS: '15000'
      MAX_RATE_LIMIT_RETRY_AFTER_SECONDS: '30'
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      NOTICE_SYNC_RECEIPT_PATH: ${{ github.workspace }}/.seekoffer-notice-sync.json
      NOTICE_WEBSITE_RECEIPT_PATH: ${{ github.workspace }}/.seekoffer-notice-website.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check D1 transport boundaries
        run: node --test tests/notice-d1-transport.test.mjs tests/notice-website-sync.test.mjs

      - name: Sync notices through authenticated D1 ingestion
        id: ingest
        run: npm run sync:notices:github

      - name: Verify live website ordering and detail
        if: ${{ !cancelled() && steps.ingest.outcome == 'success' && env.DRY_RUN != 'true' }}
        run: node scripts/verify-notice-website-sync.mjs

      - name: Publish sanitized sync receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notice-sync-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/.seekoffer-notice-sync.json
            ${{ github.workspace }}/.seekoffer-notice-website.json
          if-no-files-found: ignore
          retention-days: 14

      # The Worker atomically updates D1 notices and their public projection.
      # This workflow never calls Supabase, Vercel, or a frontend build hook.
