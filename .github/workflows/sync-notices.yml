name: Sync notices to D1

on:
  schedule:
    # GitHub schedules use UTC and can be delayed by runner availability.
    - cron: '20 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-notices.yml'
      - 'scripts/sync-baoyan-notices-to-supabase.mjs'
      - 'scripts/notice-sync-core.mjs'
      - 'scripts/notice-d1-transport.mjs'
      - 'scripts/notice-sync-report.mjs'
      - 'scripts/summarize-notice-sync-run.mjs'
      - 'scripts/verify-notice-website-sync.mjs'
      - 'tests/notice-d1-transport.test.mjs'
      - 'tests/notice-website-sync.test.mjs'
      - 'tests/notice-sync-run-report.test.mjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Acquire and validate public notices without D1 writes'
        type: boolean
        default: false

concurrency:
  group: seekoffer-notice-ingestion
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  sync:
    name: Acquire, validate and update D1 notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEEKOFFER_INGEST_BACKEND: d1
      SUPABASE_INGEST_SOURCE: github-actions-sync
      SYNC_MODE: incremental
      TARGET_YEAR: '2026'
      PRIMARY_ORDER_BY: publishTime
      PRIMARY_MAX_PAGES: '2'
      PRIMARY_MAX_DETAILS: '40'
      PRIMARY_DETAIL_CONCURRENCY: '2'
      PRIMARY_DETAIL_DELAY_MS: '150'
      ENABLE_XINGKE_SOURCE: 'true'
      ENABLE_BAOYANNEWS_SOURCE: 'true'
      INCREMENTAL_LOOKBACK_DAYS: '10'
      OFFICIAL_REPAIR_CONCURRENCY: '2'
      OFFICIAL_REPAIR_DELAY_MS: '150'
      INGEST_BATCH_SIZE: '6'
      INGEST_MAX_ATTEMPTS: '2'
      INGEST_REQUEST_TIMEOUT_MS: '30000'
      REQUEST_TIMEOUT_MS: '15000'
      MAX_RATE_LIMIT_RETRY_AFTER_SECONDS: '30'
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check D1 transport boundaries
        id: preflight
        run: node --test tests/notice-d1-transport.test.mjs tests/notice-website-sync.test.mjs tests/notice-sync-run-report.test.mjs
      - name: Sync notices through authenticated D1 ingestion
        id: ingest
        env:
          SEEKOFFER_INGEST_SECRET: ${{ secrets.SEEKOFFER_INGEST_SECRET }}
          NOTICE_SYNC_RECEIPT_PATH: ${{ runner.temp }}/seekoffer-notice-sync.json
        run: node scripts/sync-baoyan-notices-to-supabase.mjs
      - name: Verify live website version, ordering and detail
        id: website
        if: ${{ !cancelled() && steps.ingest.outcome != 'skipped' && env.DRY_RUN != 'true' }}
        # Fixed public endpoints only. No ingest secret is needed by this step.
        env:
          SEEKOFFER_INGEST_SECRET: ''
          NOTICE_WEBSITE_RECEIPT_PATH: ${{ runner.temp }}/seekoffer-notice-website.json
        run: node scripts/verify-notice-website-sync.mjs
      - name: Record ingestion and website outcomes
        if: ${{ always() }}
        env:
          NOTICE_PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          NOTICE_INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          NOTICE_WEBSITE_OUTCOME: ${{ steps.website.outcome }}
          NOTICE_SYNC_RECEIPT_PATH: ${{ runner.temp }}/seekoffer-notice-sync.json
          NOTICE_WEBSITE_RECEIPT_PATH: ${{ runner.temp }}/seekoffer-notice-website.json
          NOTICE_RUN_RECEIPT_PATH: ${{ runner.temp }}/seekoffer-notice-run.json
        run: node scripts/summarize-notice-sync-run.mjs
      - name: Retain sanitized diagnostic receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notice-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seekoffer-notice-run.json
          if-no-files-found: warn
          retention-days: 14
      # The authenticated Worker atomically updates notices + public overrides.
      # No Supabase calls, database tokens, Vercel hooks, frontend build or deploy.
      # No application-level daily count cap. Official quota errors stop safely
      # and retain an explicit incomplete result and remaining candidate count.
