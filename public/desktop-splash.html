<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>寻鹿 SeekOffer</title>
    <script>
      try {
        const raw = localStorage.getItem('seekoffer-desktop-preferences-v1');
        const preferences = raw ? JSON.parse(raw) : {};
        const themePreference = ['system', 'light', 'dark'].includes(preferences.theme)
          ? preferences.theme
          : 'light';
        const systemPrefersDark = typeof matchMedia === 'function'
          && matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = themePreference === 'system'
          ? (systemPrefersDark ? 'dark' : 'light')
          : themePreference;
        document.documentElement.dataset.desktopTheme = resolvedTheme;
        document.documentElement.dataset.desktopReduceMotion =
          preferences.reduceMotion === true ? 'true' : 'false';
        document.documentElement.style.colorScheme = resolvedTheme;
      } catch (_) {
        document.documentElement.dataset.desktopTheme = 'light';
        document.documentElement.dataset.desktopReduceMotion = 'false';
        document.documentElement.style.colorScheme = 'light';
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --splash-canvas: #ffffff;
        --splash-surface: #ffffff;
        --splash-border: #c9d0d6;
        --splash-card-border: #dde2e6;
        --splash-text: #171a1f;
        --splash-text-secondary: #626b75;
        --splash-text-tertiary: #8b949e;
        --splash-spinner-track: #dde2e6;
        --splash-brand: #137765;
      }

      :root[data-desktop-theme="dark"] {
        --splash-canvas: #18201f;
        --splash-surface: #18201f;
        --splash-border: #2d3a37;
        --splash-card-border: #43534f;
        --splash-text: #edf4f2;
        --splash-text-secondary: #b8c6c2;
        --splash-text-tertiary: #899a95;
        --splash-spinner-track: #35443f;
        --splash-brand: #7bcdbd;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--splash-text);
        background: var(--splash-canvas);
        font-family: "Segoe UI Variable Text", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 22px;
        border: 1px solid var(--splash-border);
      }

      main {
        display: flex;
        width: min(100%, 340px);
        min-height: 250px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--splash-surface);
        text-align: center;
      }

      img {
        display: block;
        width: 64px;
        height: 64px;
        overflow: hidden;
        border: 1px solid var(--splash-card-border);
        border-radius: 14px;
        background: #ffffff;
        object-fit: contain;
      }

      h1 {
        margin: 14px 0 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 28px;
      }

      p {
        margin: 20px 0 0;
        color: var(--splash-text-secondary);
        font-size: 13px;
        line-height: 20px;
      }

      .progress {
        display: block;
        width: 30px;
        height: 30px;
        margin-top: 16px;
        color: var(--splash-brand);
        animation: spin 1050ms linear infinite;
      }

      .progress svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      small {
        margin-top: 12px;
        color: var(--splash-text-tertiary);
        font-size: 12px;
        line-height: 18px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress {
          animation: none;
        }
      }

      html[data-desktop-reduce-motion="true"] .progress {
        animation: none;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="splash-title" aria-busy="true">
      <img src="./desktop/seekoffer-mark.png" alt="" />
      <h1 id="splash-title">寻鹿 SeekOffer</h1>
      <p role="status" aria-live="polite">正在启动寻鹿</p>
      <div class="progress" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" focusable="false" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" opacity="0.16" />
          <path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <small>正在准备你的工作区</small>
    </main>
  </body>
</html>
